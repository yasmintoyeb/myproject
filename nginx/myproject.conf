# Put this on the EC2 server: /etc/nginx/sites-available/myproject
# Replace myproject.site with your own domain.

# Frontend -> myproject.site
server {
    listen 80;
    server_name myproject.site www.myproject.site;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend -> backend.myproject.site
server {
    listen 80;
    server_name backend.myproject.site;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API -> api.myproject.site
server {
    listen 80;
    server_name api.myproject.site;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
