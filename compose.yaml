services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    # No "ports": MongoDB stays private inside the Docker network.

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/todoapp
      CORS_ORIGIN: ${FRONTEND_URL}
    ports:
      - "127.0.0.1:3000:3000"   # only Nginx on the server can reach it
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  mongodata:
